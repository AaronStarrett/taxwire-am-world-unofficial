name: Validate and publish game
on:
  push:
    branches: [main, development, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: taxwire-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local/browsers
      npm_config_cache: ${{ github.workspace }}/.local/cache/npm
      VITE_BASE_PATH: /taxwire-am-world-unofficial/
      SITE_BASE_PATH: /taxwire-am-world-unofficial/
      TEST_BASE_URL: http://127.0.0.1:4173/taxwire-am-world-unofficial/
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run audit:public
      - run: npx playwright install --with-deps chromium
      - name: Diagnose changed city and mobile paths on the city feature branch
        if: github.ref == 'refs/heads/feature/city-relationships'
        run: npm run test:browser -- --grep 'travels through every building|mobile floor directory|a mission challenge|phone first-day overlay|prior version 2 in-progress|coffee invitation becomes'
      - name: Verify full playable production build at repository subpath
        if: github.ref != 'refs/heads/feature/city-relationships'
        run: npm run test:browser
      - name: Retain synthetic browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-acceptance-evidence
          path: |
            .local/evidence/**/*.png
            .local/evidence/browser-results.json
            .local/evidence/failure-dom.txt
          if-no-files-found: ignore
          retention-days: 1
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages build only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
          retention-days: 1
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish validated game
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
